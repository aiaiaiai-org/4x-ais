[package]
name = "ais"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false
description = "aiaiaiai AIS: the auth identity service at auth.aiaiaiai.org"

[dependencies]
# The pub_dress grammar and its public label belong to the 0x1 contract; AIS
# uses them, it does not redefine them.
nilxone-contracts = { git = "https://github.com/nilx-one/core", rev = "2037913ee338a2c7cc453c353f0cf1c2b22cccb3" }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["form", "json", "query"] }
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
# The 0x1 client's own verifier, so tests prove the token contract it relies on.
nilxone-identity = { git = "https://github.com/nilx-one/core", rev = "2037913ee338a2c7cc453c353f0cf1c2b22cccb3" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
