name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 4x-ais-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-rules:
    name: Agent rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commit attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ruby scripts/check-commit-attribution.rb

      - name: Test commit attribution checker
        run: ruby scripts/test-commit-attribution.rb

      - name: Check shared files against the canonical source
        run: ruby scripts/check-shared-sync.rb

      - name: Test shared sync checker
        run: ruby scripts/test-shared-sync.rb

  service:
    name: Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler with clippy and rustfmt.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Smoke test the built service
        run: bash scripts/smoke.sh
