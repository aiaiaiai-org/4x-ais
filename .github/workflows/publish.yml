name: Publish image
on:
  push:
    branches: [master]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate placeholder server
        run: python -m py_compile server.py
      - name: Smoke test placeholder endpoints
        run: |
          set -euo pipefail
          python -B server.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1927/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:1927/healthz)" = ok
          curl -fsS http://127.0.0.1:1927/ | grep -q 'Identity, in progress'
          curl -fsS http://127.0.0.1:1927/static/auth.css | grep -q 'ecosystem-auth-panel'
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/aiaiaiai-org/4x-ais:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          [[ "$REF" =~ ^ghcr\.io/.+@(sha256:[0-9a-f]{64})$ ]]
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/aiaiaiai-org/4x-ais
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
